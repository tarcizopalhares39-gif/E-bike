<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bike Correios V16 (Gemini Edition)</title>
    <style>
        /* --- SPLASH SCREEN SYSTEM (PREMIUM AMOLED) --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }

        .splash-content { text-align: center; position: relative; }

        /* Ícone Raio */
        .splash-icon {
            width: 80px; height: 80px; margin-bottom: 20px;
            fill: transparent; stroke: #00E676; stroke-width: 2;
            filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.5));
            animation: pulse-neon 2s infinite ease-in-out;
        }
        
        .splash-icon path {
            fill: #000; stroke: #2196F3; stroke-width: 3px;
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            animation: draw-stroke 2.5s forwards ease-in-out, fill-in 1s 2s forwards;
        }

        /* Texto Título */
        .splash-title {
            font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 1.8rem;
            color: #fff; text-transform: uppercase; letter-spacing: 0.5em;
            opacity: 0; transform: translateY(20px); filter: blur(10px);
            animation: text-reveal 1.5s 0.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .splash-subtitle {
            font-size: 0.9rem; color: #2196F3; letter-spacing: 0.2em; margin-top: 5px;
            opacity: 0; animation: fade-in 1s 1.5s forwards;
        }

        /* Barra de Carregamento */
        .splash-loader {
            width: 150px; height: 2px; background: #1a1a1a;
            margin: 30px auto 0; border-radius: 2px; overflow: hidden; position: relative;
            opacity: 0; animation: fade-in 1s 2s forwards;
        }

        .splash-loader::after {
            content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 50%;
            background: linear-gradient(90deg, transparent, #2196F3, transparent);
            transform: translateX(-100%);
            animation: shimmer-load 1.5s 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ANIMAÇÕES DO SPLASH */
        @keyframes draw-stroke { to { stroke-dashoffset: 0; } }
        @keyframes fill-in { to { fill: #2196F3; stroke: #fff; filter: drop-shadow(0 0 20px #2196F3); } }
        @keyframes pulse-neon { 
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(33, 150, 243, 0.4)); } 
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(33, 150, 243, 0.8)); } 
        }
        @keyframes text-reveal { 
            to { opacity: 1; transform: translateY(0); letter-spacing: 0.1em; filter: blur(0); } 
        }
        @keyframes fade-in { to { opacity: 1; } }
        @keyframes shimmer-load { 
            0% { transform: translateX(-150%); } 
            100% { transform: translateX(250%); } 
        }

        /* Ocultar conteúdo principal inicialmente */
        body.loading-state { overflow: hidden; }
        .main-content { 
            opacity: 0; transform: translateY(30px); transition: all 1s ease-out; 
            filter: blur(5px);
        }
        .main-content.visible { 
            opacity: 1; transform: translateY(0); filter: blur(0); 
        }

        /* --- DESIGN SYSTEM CORREIOS (ORIGINAL MANTIDO) --- */
        :root {
            --bg-main: #0a192f; --bg-card: #172a45;
            --yellow: #FFD700; --blue: #2196F3;
            --text: #e6f1ff; --dim: #8892b0;
            --green: #00E676; --red: #FF3D00;
            --input-bg: #0a192f; --input-border: #233554;
            --gemini-grad: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
        }

        /* MODO DARK AMOLED (#000000) */
        body.dark-mode {
            --bg-main: #000000; --bg-card: #0a0a0a; --text: #ffffff;
            --dim: #aaaaaa; --input-bg: #000000; --input-border: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main); color: var(--text);
            padding: 20px; padding-bottom: 80px; line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            margin: 0; /* Reset básico */
        }

        /* CABEÇALHO COM BOTÃO */
        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }

        h2 {
            background: linear-gradient(90deg, var(--yellow), var(--blue));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-align: left; font-weight: 800; letter-spacing: 1px; margin: 0;
        }

        .theme-toggle {
            background: var(--bg-card); border: 1px solid var(--yellow);
            color: var(--yellow); padding: 8px; border-radius: 50%;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 1.2em; transition: all 0.3s;
        }

        /* ANIMAÇÕES GERAIS */
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .card {
            background-color: var(--bg-card); padding: 20px; border-radius: 16px;
            margin-bottom: 20px; border: 1px solid rgba(255, 215, 0, 0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
        }

        /* BORDAS LUMINOSAS NOS CARDS PRINCIPAIS (MODO DARK) */
        body.dark-mode .card.glow-blue { border: 1px solid var(--blue); box-shadow: 0 0 12px rgba(33, 150, 243, 0.3); }
        body.dark-mode .card.glow-yellow { border: 1px solid var(--yellow); box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); }
        body.dark-mode .card.glow-green { border: 1px solid var(--green); box-shadow: 0 0 12px rgba(0, 230, 118, 0.3); }

        h3 { margin: 0; color: var(--yellow); font-weight: 600; display:flex; justify-content:space-between; align-items:center; }
        label { display: block; margin-top: 15px; color: var(--dim); font-size: 0.9em; font-weight: 500; }
        
        /* INPUTS BLINDADOS */
        input, select {
            width: 100%; padding: 14px; margin-top: 8px; border-radius: 12px;
            border: 2px solid var(--input-border); background-color: var(--input-bg); color: var(--text);
            font-size: 16px; box-sizing: border-box; transition: all 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--yellow); }

        button { cursor: pointer; transition: transform 0.2s; border: none; border-radius: 12px; font-weight: bold; }
        button:active { transform: scale(0.96); }

        .btn-calc {
            width: 100%; padding: 16px; font-size: 18px; margin-top: 10px;
            background: linear-gradient(135deg, var(--yellow) 0%, #FFA000 100%); color: #0a192f;
            animation: pulse 2s infinite;
        }
        
        .btn-ia { width: 100%; padding: 15px; margin-top: 20px; background: var(--blue); color: #fff; font-size: 16px; }
        .btn-copy { width: 100%; padding: 15px; margin-top: 10px; background: var(--green); color: #003300; font-size: 16px; }
        
        /* BOTÃO GEMINI */
        .btn-gemini {
            width: 100%; padding: 16px; margin-top: 15px;
            background: linear-gradient(90deg, #4b6cb7, #182848, #4b6cb7);
            background-size: 200% 100%;
            color: white; font-size: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            animation: shimmer 3s infinite linear;
        }

        .bat-container { height: 20px; background: var(--bg-main); border-radius: 10px; margin-top: 5px; overflow: hidden; border: 1px solid #333; }
        .bat-fill { height: 100%; width: 0%; transition: width 1s ease-in-out; background: var(--yellow); }

        .resultado-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        
        .resultado-box { 
            background: rgba(10, 25, 47, 0.5); 
            padding: 15px; border-radius: 12px; text-align: center; 
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s ease;
        }
        
        body.dark-mode .resultado-box { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(33, 150, 243, 0.4);
            box-shadow: 0 0 8px rgba(33, 150, 243, 0.15);
        }
        
        body.dark-mode .resultado-box:nth-child(even) { border-color: rgba(0, 230, 118, 0.4); box-shadow: 0 0 8px rgba(0, 230, 118, 0.15); }

        .res-titulo { font-size: 0.8em; color: var(--dim); text-transform: uppercase; }
        .res-valor { font-size: 1.3em; font-weight: 800; color: var(--text); }
        .codigo-box { text-align: center; margin-top: 20px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; color: var(--dim); font-family: monospace; }

        #boxComentarioIA {
            background: linear-gradient(to right, rgba(33, 150, 243, 0.1), transparent);
            border-left: 4px solid var(--blue);
            padding: 20px; border-radius: 0 12px 12px 0; margin-top: 20px;
            color: var(--text); display: none; line-height: 1.6;
            font-size: 0.95em; transition: all 0.4s ease;
        }
        
        body.dark-mode #boxComentarioIA {
            background: rgba(33, 150, 243, 0.05); border: 1px solid var(--blue);
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.2);
        }

        .btn-magic { background: none; border: 1px solid var(--blue); color: var(--blue); padding: 4px 10px; border-radius: 15px; font-size: 0.75em; float: right; }
        #areaCopia { height: 1px; opacity: 0; position:absolute; }
        .btn-reset { margin-top:20px; background:none; border:1px solid #555; color:#888; padding:8px 20px; border-radius:20px; font-size:0.8em; }
    </style>
</head>
<body class="loading-state" onload="iniciarSistema()">

    <div id="splash-screen">
        <div class="splash-content">
            <svg class="splash-icon" viewBox="0 0 24 24">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
            </svg>
            <div class="splash-title">E-BIKE V16</div>
            <div class="splash-subtitle">SYSTEM INITIALIZATION</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="header-container">
            <h2>🚴 E-BIKE V16 <span style="color:var(--yellow)">GEMINI</span></h2>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>

        <div class="card glow-blue">
            <h3>
                <span>📊 Dados</span>
                <button class="btn-magic" onclick="usarUltimo()">↺ Usar Último</button>
            </h3>
            <label>Odo Inicial</label><input type="tel" id="odoIni" placeholder="Ex: 1797.30" oninput="tentaSalvar()">
            <label>Odo Final</label><input type="tel" id="odoFim" placeholder="Ex: 1812.50" oninput="tentaSalvar()">
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label>Bat. Inicial %</label><input type="tel" id="batIni" value="100" style="color:var(--yellow); font-weight:bold;" oninput="tentaSalvar()"></div>
                <div style="flex:1;"><label>Bat. Final %</label><input type="tel" id="batFim" placeholder="Ex: 76" oninput="tentaSalvar()"></div>
            </div>
        </div>

        <div class="card glow-yellow">
            <h3>⚙️ Condições</h3>
            <label>Terreno</label>
            <select id="esf1" onchange="tentaSalvar()">
                <option value="1">1 - Retas (Leve)</option>
                <option value="2">2 - Misto (Médio)</option>
                <option value="3">3 - Subidas (Pesado)</option>
            </select>
            <label>Carga</label>
            <select id="esf2" onchange="tentaSalvar()">
                <option value="1">1 - Sem carga</option>
                <option value="2">2 - Leve/Média</option>
                <option value="3">3 - Pesada</option>
            </select>
            <label>Clima</label>
            <select id="esf3" onchange="tentaSalvar()">
                <option value="1">1 - Sol/Nublado</option>
                <option value="2">2 - Chuva Leve</option>
                <option value="3">3 - Chuva Forte</option>
            </select>
        </div>

        <button class="btn-calc" onclick="calcular()">⚡ CALCULAR AGORA</button>

        <div id="resultados" style="display:none; margin-top: 30px;">
            <div class="card glow-green" style="border-color: var(--yellow);">
                <h3 style="text-align:center; color: var(--yellow);">🚀 Relatório Técnico</h3>
                
                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="margin-top:0; font-size:0.8em;">Bateria Restante</label>
                    <div class="bat-container"><div id="barraBateria" class="bat-fill"></div></div>
                    <div style="text-align:right; font-size:0.8em; color:var(--dim);"><span id="txtBatFinal">0</span>%</div>
                </div>

                <div class="resultado-grid">
                    <div class="resultado-box"><div class="res-titulo">Distância</div><div class="res-valor"><span id="resDist">0</span> km</div></div>
                    <div class="resultado-box"><div class="res-titulo">Autonomia</div><div class="res-valor"><span id="resAutonomia">0</span> km</div></div>
                    <div class="resultado-box"><div class="res-titulo">Consumo</div><div class="res-valor" style="color:var(--blue)"><span id="resConsumoP">0</span>%</div></div>
                    <div class="resultado-box"><div class="res-titulo">Eficiência</div><div class="res-valor" style="color:var(--blue)"><span id="resWhKm">0</span> <small>Wh/km</small></div></div>
                    <div class="resultado-box"><div class="res-titulo">Custo Total</div><div class="res-valor" style="color:var(--yellow)">R$ <span id="resCusto">0,00</span></div></div>
                    <div class="resultado-box"><div class="res-titulo">Custo / Km</div><div class="res-valor" style="color:var(--yellow)">R$ <span id="resCustoKm">0,00</span></div></div>
                </div>

                <div class="codigo-box">CÓDIGO: <span id="resCodigo">---</span></div>
                
                <button class="btn-ia" onclick="analisarIA()">📊 ANÁLISE INTERNA (RÁPIDA)</button>
                <div id="boxComentarioIA"></div>

                <button class="btn-gemini" onclick="analisarNoGemini()">
                    ✨ ANALISAR NO GEMINI
                </button>

                <div style="margin-top: 30px; padding-top:20px; border-top:1px solid #333;">
                    <textarea id="areaCopia" readonly></textarea>
                    <button class="btn-copy" id="btnEnviar" onclick="enviarParaPlanilha()">📤 SALVAR NA PLANILHA</button>
                </div>
                
                <div style="text-align:center;">
                    <button onclick="limpar()" class="btn-reset">Reiniciar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BAT_WH = 720; const CUSTO = 0.85; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7vEc5lfbEBSrOxAY0fmHV5E5v2I-cEppueDeZBLrLvpzC5nwAL1c0N5kHX917CUXLCA/exec";
        
        let g_whKm = 0; let g_terreno = 0; let g_carga = 0; let g_clima = 0; let g_custoKm = 0;

        // --- INICIALIZAÇÃO DO SISTEMA (COM SPLASH) ---
        function iniciarSistema() {
            tentaCarregar(); // Carrega dados do localStorage
            
            // Timeout para simular "Boot" do sistema e exibir o Splash
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const main = document.querySelector('.main-content');
                
                // Fade out no splash
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                
                // Slide up no conteúdo principal
                document.body.classList.remove('loading-state');
                main.classList.add('visible');

                // Remove splash do DOM para liberar memória
                setTimeout(() => { splash.style.display = 'none'; }, 1000);
            }, 3500); // 3.5 segundos de splash screen
        }

        // --- MODO DARK ---
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            body.classList.toggle('dark-mode');
            
            if(body.classList.contains('dark-mode')) {
                btn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        // --- MOTOR BLINDADO ---
        function lerNumero(id) {
            let val = document.getElementById(id).value;
            if(!val) return NaN;
            val = val.replace(',', '.'); 
            return parseFloat(val);
        }

        // --- MEMÓRIA ---
        function tentaSalvar() {
            try {
                localStorage.setItem('odoIni', document.getElementById('odoIni').value);
                localStorage.setItem('odoFim', document.getElementById('odoFim').value);
                localStorage.setItem('batIni', document.getElementById('batIni').value);
                localStorage.setItem('batFim', document.getElementById('batFim').value);
                localStorage.setItem('esf1', document.getElementById('esf1').value);
                localStorage.setItem('esf2', document.getElementById('esf2').value);
                localStorage.setItem('esf3', document.getElementById('esf3').value);
            } catch(e) {}
        }
        function tentaCarregar() {
            try {
                // Força dark mode se não houver preferência, ou respeita a memória
                if(localStorage.getItem('theme') === 'light') {
                    document.getElementById('themeBtn').innerText = '🌙';
                } else {
                    document.body.classList.add('dark-mode');
                    document.getElementById('themeBtn').innerText = '☀️';
                }
                
                if(localStorage.getItem('odoIni')) document.getElementById('odoIni').value = localStorage.getItem('odoIni');
                if(localStorage.getItem('odoFim')) document.getElementById('odoFim').value = localStorage.getItem('odoFim');
                if(localStorage.getItem('batIni')) document.getElementById('batIni').value = localStorage.getItem('batIni');
                if(localStorage.getItem('batFim')) document.getElementById('batFim').value = localStorage.getItem('batFim');
                if(localStorage.getItem('esf1')) document.getElementById('esf1').value = localStorage.getItem('esf1');
                if(localStorage.getItem('esf2')) document.getElementById('esf2').value = localStorage.getItem('esf2');
                if(localStorage.getItem('esf3')) document.getElementById('esf3').value = localStorage.getItem('esf3');
            } catch(e) {}
        }
        function usarUltimo() {
            try {
                let u = localStorage.getItem('histUltimo');
                if(u) { 
                    document.getElementById('odoIni').value = u; 
                    document.getElementById('odoFim').value = ""; 
                    document.getElementById('batIni').value = "100"; 
                    document.getElementById('batFim').value = ""; 
                    alert("Último odômetro recuperado!");
                    tentaSalvar();
                } else { alert("Nenhum dado anterior encontrado."); }
            } catch(e) { alert("Erro ao acessar memória."); }
        }

        // --- ANIMAÇÃO SUAVE ---
        function animar(id, valorFinal, decimais) {
            let obj = document.getElementById(id);
            let steps = 20; let current = 0; let inc = valorFinal / steps;
            let timer = setInterval(() => {
                current += inc;
                if (current >= valorFinal) {
                    obj.innerText = valorFinal.toFixed(decimais).replace('.', ',');
                    clearInterval(timer);
                } else {
                    obj.innerText = current.toFixed(decimais).replace('.', ',');
                }
            }, 20);
        }

        function calcular() {
            let i = lerNumero('odoIni');
            let f = lerNumero('odoFim');
            let bi = lerNumero('batIni');
            let bf = lerNumero('batFim');

            if (isNaN(i) || isNaN(f) || isNaN(bi) || isNaN(bf)) { alert("Preencha todos os campos!"); return; }
            let dist = f - i; let consP = bi - bf;
            if (dist <= 0) { alert("A quilometragem final deve ser maior que a inicial."); return; }

            let aut = (dist / consP) * 100; if (!isFinite(aut)) aut = 0;
            let whKm = (BAT_WH * (consP / 100)) / dist;
            let custoTot = (BAT_WH / 1000) * CUSTO * (consP / 100);
            let custoKm = custoTot / dist;

            g_whKm = whKm; g_custoKm = custoKm;
            g_terreno = parseInt(document.getElementById('esf1').value);
            g_carga = parseInt(document.getElementById('esf2').value);
            g_clima = parseInt(document.getElementById('esf3').value);
            let cod = `${g_terreno}.${g_carga}.${g_clima}`;

            let div = document.getElementById('resultados');
            div.style.display = 'block'; div.scrollIntoView({behavior:"smooth"});

            animar('resDist', dist, 2);
            animar('resAutonomia', aut, 1);
            animar('resConsumoP', consP, 0);
            animar('resWhKm', whKm, 2);
            animar('resCusto', custoTot, 2);
            animar('resCustoKm', custoKm, 3);
            
            document.getElementById('resCodigo').innerText = cod;

            let barra = document.getElementById('barraBateria');
            barra.style.width = bf + "%";
            document.getElementById('txtBatFinal').innerText = bf;
            if (bf > 50) barra.style.background = "#00E676";
            else if (bf > 20) barra.style.background = "#FFD700";
            else barra.style.background = "#FF3D00";

            try { localStorage.setItem('histUltimo', f); } catch(e){}

            let hoje = new Date().toLocaleDateString('pt-BR'); 
            let hora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
            let exp = `${hoje}\t${hora}\t${i}\t${f}\t${dist.toFixed(2).replace('.',',')}\t${bi}\t${bf}\t${consP}\t${cod}\t${whKm.toFixed(2).replace('.',',')}\tR$ ${custoTot.toFixed(2).replace('.',',')}`;
            document.getElementById('areaCopia').value = exp;
            
            document.getElementById('boxComentarioIA').style.display = 'none';
        }

        // --- CÉREBRO TURBO (LOCAL) ---
        function analisarIA() {
            let html = "";
            let titulos = ["📋 Relatório Operacional", "📊 Análise Técnica Avançada", "🔎 Diagnóstico de Performance"];
            let randT = titulos[Math.floor(Math.random() * titulos.length)];

            html += `<strong style="font-size:1.1em; color:#2196F3; display:block; margin-bottom:15px; border-bottom:1px solid #444; padding-bottom:5px;">${randT}</strong>`;

            if (g_whKm < 12) {
                html += `<div style="color:#00E676; margin-bottom:15px;"><b>🟢 Eficiência de Elite (<12 Wh/km):</b><br>O consumo registrado demonstra uma pilotagem técnica excelente. O uso frequente da inércia ("banguela") e aceleração progressiva resultaram em máxima autonomia.</div>`;
            } else if (g_whKm <= 20) {
                html += `<div style="color:#FFD700; margin-bottom:15px;"><b>🔵 Padrão Operacional (12-20 Wh/km):</b><br>O veículo operou dentro da faixa de consumo esperada pelo fabricante. O equilíbrio entre velocidade de entrega e preservação da bateria foi mantido corretamente.</div>`;
            } else {
                html += `<div style="color:#FF3D00; margin-bottom:15px;"><b>🔴 Consumo Crítico (>20 Wh/km):</b><br>Atenção! A média de consumo superou significativamente o padrão. Isso reduz drasticamente a autonomia projetada e aumenta o desgaste da bateria.</div>`;
            }

            if (g_whKm > 20) {
                html += `<div style="background:rgba(255, 61, 0, 0.1); padding:12px; border-radius:8px; margin-bottom:15px; border-left:3px solid #FF3D00;"><b>🔎 Análise de Causa Raiz:</b><br>`;
                if (g_carga === 3 && g_terreno === 3) {
                    html += `O alto consumo é <b>tecnicamente inevitável</b> neste cenário. A combinação de <u>Carga Pesada</u> em <u>Subidas Íngremes</u> forçou o motor a operar em regime de torque máximo constante.`;
                } else if (g_carga === 3) {
                    html += `O fator determinante foi o <b>Peso da Carga</b>, que exigiu picos de corrente elétrica nas retomadas de velocidade.`;
                } else if (g_terreno === 3) {
                    html += `O fator predominante foi a <b>Topografia (Subidas)</b>, que é a maior responsável pelo dreno de energia em VEs.`;
                } else {
                    html += `⚠️ <b>Alerta de Anomalia:</b> O consumo foi alto mas não houve carga ou subida extrema reportada.<br><br><b>Ação Recomendada:</b> Verifique imediatamente a <u>calibragem dos pneus</u> (pneu murcho aumenta drasticamente o arrasto) ou se há algum freio raspando na roda.`;
                }
                html += `</div>`;
            }

            if (g_clima === 3) {
                html += `<div style="background:rgba(33, 150, 243, 0.15); border:1px solid #2196F3; padding:12px; border-radius:8px; margin-bottom:10px;">🌧️ <b>Protocolo de Chuva Forte:</b><br>O veículo foi exposto a condições severas. Ao final do turno:<br>1. Seque os contatos da bateria com pano seco.<br>2. Lubrifique a corrente para evitar oxidação prematura.</div>`;
            }

            if (g_custoKm < 0.02) {
                html += `<div style="font-size:0.9em; color:#888; margin-top:10px; border-top:1px solid #333; padding-top:5px;">💰 <b>Viabilidade Econômica:</b> Custo operacional extremamente baixo: R$ ${g_custoKm.toFixed(3)}/km.</div>`;
            }

            let box = document.getElementById('boxComentarioIA');
            box.innerHTML = html;
            box.style.display = 'block';
        }

           function enviarParaPlanilha() {

            const btn = document.getElementById('btnEnviar');
            const textoOriginal = btn.innerText;

            btn.disabled = true;
            btn.style.background = "#555";

            let dados = {
                data: new Date().toLocaleDateString('pt-BR'),

                distancia: document.getElementById('resDist').innerText,
                batIni: document.getElementById('batIni').value,

                consumoP: document.getElementById('resConsumoP').innerText,
                codigo: document.getElementById('resCodigo').innerText,
                eficiencia: document.getElementById('resWhKm').innerText.replace(' Wh/km',''),
                custoTotal: document.getElementById('resCusto').innerText,
                custoKm: document.getElementById('resCustoKm').innerText
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(dados)
            })
            .then(() => {
                alert("✅ DADOS COMPLETOS ENVIADOS!");
                btn.style.background = "#00E676";

                    btn.innerText = textoOriginal;
                    btn.disabled = false;
                }, 2000);
            })

                alert("❌ Erro de conexão.");
                btn.innerText = textoOriginal;
                btn.disabled = false;
                btn.style.background = "#FF3D00";
