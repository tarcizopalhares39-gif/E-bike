<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bike Correios V4.1 Ultra (AMOLED Haptic 3D)</title>
    <style>
        /* --- BACKGROUND AMOLED FIXO --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #001a3b 0%, #000000 50%);
            background-color: #000000;
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px; padding-bottom: 80px; line-height: 1.6;
            margin: 0; overflow-x: hidden;
        }

        /* --- ANIMAÇÕES CINEMATOGRÁFICAS INICIAIS --- */
        @keyframes cinematic-enter {
            0% { opacity: 0; transform: translateY(40px) scale(0.95) rotateX(-10deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
        }

        .anim-cascade { opacity: 0; animation: cinematic-enter 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* --- SPLASH SCREEN SYSTEM (AMOLED 3D) --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(0deg, #001a3b 0%, #000000 60%);
            background-color: #000000;
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s, transform 0.8s;
        }

        .splash-content {
            text-align: center; position: relative;
            background: linear-gradient(145deg, #111111, #050505);
            padding: 40px; border-radius: 24px;
            box-shadow: inset 0 20px 40px -20px rgba(33, 150, 243, 0.3), 0 8px 0 #000000, 0 25px 30px rgba(0,0,0,0.9);
            border-top: 1px solid #2196F3;
        }

        .splash-icon {
            width: 80px; height: 80px; margin-bottom: 20px; fill: transparent; stroke: #00E676; stroke-width: 2;
            filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.5));
            animation: pulse-neon 2s infinite ease-in-out;
        }
        
        .splash-icon path {
            fill: #000; stroke: #2196F3; stroke-width: 3px; stroke-dasharray: 1000; stroke-dashoffset: 1000;
            animation: draw-stroke 2.5s forwards ease-in-out, fill-in 1s 2s forwards;
        }

        .splash-title {
            font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 1.8rem;
            color: #fff; text-transform: uppercase; letter-spacing: 0.5em;
            opacity: 0; transform: translateY(20px); filter: blur(10px);
            animation: text-reveal 1.5s 0.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .splash-subtitle {
            font-size: 0.9rem; color: #2196F3; letter-spacing: 0.2em; margin-top: 5px; opacity: 0; animation: fade-in 1s 1.5s forwards;
        }

        .splash-loader {
            width: 150px; height: 4px; background: #000; margin: 30px auto 0; border-radius: 2px; overflow: hidden; position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); opacity: 0; animation: fade-in 1s 2s forwards;
        }

        .splash-loader::after {
            content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 50%;
            background: linear-gradient(90deg, transparent, #2196F3, transparent); transform: translateX(-100%);
            animation: shimmer-load 1.5s 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes draw-stroke { to { stroke-dashoffset: 0; } }
        @keyframes fill-in { to { fill: #2196F3; stroke: #fff; filter: drop-shadow(0 0 20px #2196F3); } }
        @keyframes pulse-neon { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(33, 150, 243, 0.4)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(33, 150, 243, 0.8)); } }
        @keyframes text-reveal { to { opacity: 1; transform: translateY(0); letter-spacing: 0.1em; filter: blur(0); } }
        @keyframes fade-in { to { opacity: 1; } }
        @keyframes shimmer-load { 0% { transform: translateX(-150%); } 100% { transform: translateX(250%); } }

        body.loading-state { overflow: hidden; }
        
        /* --- ANIMAÇÃO DE CASCATA DOS RESULTADOS --- */
        .anim-up {
            opacity: 0;
            animation: slideUpResults 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .d-1 { animation-delay: 0.1s; }
        .d-2 { animation-delay: 0.2s; }
        .d-3 { animation-delay: 0.3s; }
        .d-4 { animation-delay: 0.4s; }
        .d-5 { animation-delay: 0.5s; }
        .d-6 { animation-delay: 0.6s; }
        .d-7 { animation-delay: 0.7s; }
        .d-8 { animation-delay: 0.8s; }

        @keyframes slideUpResults {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- DESIGN SYSTEM SKEUOMÓRFICO 3D --- */
        :root {
            --yellow: #FFD700; --blue: #2196F3; --green: #00E676; --red: #FF3D00;
            --dim: #aaaaaa; --card-bg: linear-gradient(145deg, #111111, #050505);
        }

        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        h2 {
            background: linear-gradient(90deg, var(--yellow), var(--blue));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-align: left; font-weight: 800; letter-spacing: 1px; margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .card {
            background: var(--card-bg); padding: 20px; border-radius: 16px; margin-bottom: 20px;
            box-shadow: 0 6px 0 #000000, 0 15px 20px rgba(0,0,0,0.9);
            border: 1px solid transparent; transform-style: preserve-3d;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .glow-blue { border-top: 1px solid var(--blue); box-shadow: inset 0 20px 40px -20px rgba(33, 150, 243, 0.3), 0 6px 0 #000000, 0 15px 20px rgba(0,0,0,0.9); }
        .glow-yellow { border-top: 1px solid var(--yellow); box-shadow: inset 0 20px 40px -20px rgba(255, 215, 0, 0.3), 0 6px 0 #000000, 0 15px 20px rgba(0,0,0,0.9); }
        .glow-green { border-top: 1px solid var(--green); box-shadow: inset 0 20px 40px -20px rgba(0, 230, 118, 0.3), 0 6px 0 #000000, 0 15px 20px rgba(0,0,0,0.9); }

        h3 { margin: 0; color: var(--yellow); font-weight: 600; display:flex; justify-content:space-between; align-items:center; }
        label { display: block; margin-top: 15px; color: var(--dim); font-size: 0.9em; font-weight: 500; }
        
        .icon-3d {
            display: inline-block;
            text-shadow: -1px -1px 1px rgba(255,255,255,0.2), 2px 2px 3px rgba(0,0,0,0.9);
            transform: translateZ(10px); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        input, select {
            width: 100%; padding: 14px; margin-top: 8px; border-radius: 12px;
            background: #000000; color: #ffffff; font-size: 16px; box-sizing: border-box;
            border: 1px solid #222;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 0 10px rgba(33,150,243,0.3); }

        button { 
            cursor: pointer; border: none; border-radius: 12px; font-weight: bold;
            background: var(--card-bg); color: #fff;
            box-shadow: 0 6px 0 #000000, 0 10px 15px rgba(0,0,0,0.6);
            border-top: 1px solid rgba(255,255,255,0.2);
            transition: all 0.15s ease-out; touch-action: manipulation;
        }

        button:active {
            transform: translateY(6px) scale(0.97) !important;
            box-shadow: inset 0 15px 25px rgba(0,0,0,0.9), 0 0px 0 #000000, 0 2px 5px rgba(0,0,0,0.5) !important;
            border-top-color: transparent !important;
        }

        .btn-calc {
            width: 100%; padding: 16px; font-size: 18px; margin-top: 10px;
            background: linear-gradient(145deg, #FFA000, #FF6F00); color: #000;
            border-top: 1px solid #FFD700;
            box-shadow: inset 0 20px 40px -20px rgba(255,255,255,0.5), 0 6px 0 #8c3f00, 0 15px 20px rgba(0,0,0,0.8);
        }
        
        .btn-ia { width: 100%; padding: 15px; margin-top: 20px; background: linear-gradient(145deg, #1e88e5, #1565c0); border-top: 1px solid #64b5f6; box-shadow: 0 6px 0 #003c8f, 0 10px 15px rgba(0,0,0,0.6); }
        .btn-copy { width: 100%; padding: 15px; margin-top: 10px; background: linear-gradient(145deg, #00c853, #009624); color: #000; border-top: 1px solid #69f0ae; box-shadow: 0 6px 0 #00600f, 0 10px 15px rgba(0,0,0,0.6); }
        
        .btn-gemini {
            width: 100%; padding: 16px; margin-top: 15px;
            background: linear-gradient(145deg, #4b6cb7, #182848); color: white; font-size: 16px;
            border-top: 1px solid #8e9eab; display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 6px 0 #0a1128, 0 10px 15px rgba(0,0,0,0.6);
        }

        /* --- BARRA DE BATERIA ANIMADA --- */
        .bat-container { height: 20px; background: #000; border-radius: 10px; margin-top: 5px; overflow: hidden; border: 1px solid #333; box-shadow: inset 0 3px 6px rgba(0,0,0,0.8); }
        .bat-fill { height: 100%; width: 0%; transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); background: var(--yellow); }

        .resultado-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        
        .resultado-box { 
            background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; 
            border-top: 3px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 0 #000000, 0 8px 12px rgba(0,0,0,0.8);
        }
        .resultado-box:nth-child(even) { border-top: 3px solid rgba(0, 230, 118, 0.3); box-shadow: inset 0 15px 20px -15px rgba(0, 230, 118, 0.1), 0 4px 0 #000000, 0 8px 12px rgba(0,0,0,0.8); }
        .resultado-box:nth-child(odd) { border-top: 3px solid rgba(33, 150, 243, 0.3); box-shadow: inset 0 15px 20px -15px rgba(33, 150, 243, 0.1), 0 4px 0 #000000, 0 8px 12px rgba(0,0,0,0.8); }

        .res-titulo { font-size: 0.8em; color: var(--dim); text-transform: uppercase; font-weight: bold; }
        .res-valor { font-size: 1.4em; font-weight: 900; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .codigo-box { text-align: center; margin-top: 20px; padding: 12px; background: #000; border-radius: 10px; color: var(--dim); font-family: monospace; box-shadow: inset 0 4px 8px rgba(0,0,0,0.9); border: 1px solid #222; }

        #boxComentarioIA {
            background: linear-gradient(to right, rgba(33, 150, 243, 0.05), #050505);
            border-left: 4px solid var(--blue); padding: 20px; border-radius: 0 12px 12px 0; margin-top: 20px;
            color: #fff; display: none; line-height: 1.6; font-size: 0.95em;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.8);
        }

        .btn-magic { background: #000; border: 1px solid var(--blue); color: var(--blue); padding: 6px 12px; border-radius: 15px; font-size: 0.75em; float: right; box-shadow: 0 3px 0 #000; border-top: 1px solid #64b5f6; }
        #areaCopia { height: 1px; opacity: 0; position:absolute; }
        .btn-reset { margin-top:20px; background:#050505; border:1px solid #333; color:#888; padding:8px 20px; border-radius:20px; font-size:0.8em; box-shadow: 0 3px 0 #000; border-top: 1px solid #444; }

        /* --- ADAPTAÇÃO MOBILE (RESPONSIVIDADE) --- */
        @media (max-width: 480px) {
            .resultado-grid { gap: 8px; }
            .resultado-box { padding: 10px; }
            .res-valor { font-size: 1.15em; }
            .res-titulo { font-size: 0.75em; }
        }
    </style>
</head>
<body class="loading-state" onload="iniciarSistema()">

    <div id="splash-screen">
        <div class="splash-content">
            <svg class="splash-icon" viewBox="0 0 24 24">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
            </svg>
            <div class="splash-title">E-BIKE 4.1 Ultra</div>
            <div class="splash-subtitle">SYSTEM INITIALIZATION</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <div class="main-content">
        
        <div id="form-container">
            <div class="header-container anim-cascade delay-1">
                <h2><span class="icon-3d">🚴</span> E-BIKE 4.1 <span style="color:var(--yellow)">Ultra</span></h2>
            </div>

            <div class="card glow-blue anim-cascade delay-2">
                <h3>
                    <span><span class="icon-3d">📊</span> Dados</span>
                    <button class="btn-magic" onclick="usarUltimo()">↺ Usar Último</button>
                </h3>
                <label>Odo Inicial</label><input type="tel" id="odoIni" placeholder="Ex: 1797.30" oninput="tentaSalvar()">
                <label>Odo Final</label><input type="tel" id="odoFim" placeholder="Ex: 1812.50" oninput="tentaSalvar()">
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label>Bat. Inicial %</label><input type="tel" id="batIni" value="100" style="color:var(--yellow); font-weight:bold; text-shadow: 0 2px 4px #000;" oninput="tentaSalvar()"></div>
                    <div style="flex:1;"><label>Bat. Final %</label><input type="tel" id="batFim" placeholder="Ex: 76" oninput="tentaSalvar()"></div>
                </div>
            </div>

            <div class="card glow-yellow anim-cascade delay-3">
                <h3><span class="icon-3d">⚙️</span> Condições</h3>
                <label>Terreno</label>
                <select id="esf1" onchange="tentaSalvar()">
                    <option value="1">1 - Retas (Leve)</option>
                    <option value="2">2 - Misto (Médio)</option>
                    <option value="3">3 - Subidas (Pesado)</option>
                </select>
                <label>Carga</label>
                <select id="esf2" onchange="tentaSalvar()">
                    <option value="1">1 - Sem carga</option>
                    <option value="2">2 - Leve/Média</option>
                    <option value="3">3 - Pesada</option>
                </select>
                <label>Clima</label>
                <select id="esf3" onchange="tentaSalvar()">
                    <option value="1">1 - Sol/Nublado</option>
                    <option value="2">2 - Chuva Leve</option>
                    <option value="3">3 - Chuva Forte</option>
                </select>
            </div>

            <button class="btn-calc anim-cascade delay-4" onclick="calcular()"><span class="icon-3d">⚡</span> CALCULAR AGORA</button>
        </div>

        <div id="resultados" style="display:none; margin-top: 10px;">
            <div class="card glow-green anim-up d-1" style="border-color: var(--yellow);">
                <h3 class="anim-up d-2" style="text-align:center; color: var(--yellow); justify-content: center;"><span class="icon-3d">🚀</span> Relatório Técnico</h3>
                
                <div class="anim-up d-3" style="margin-bottom: 20px; text-align: left;">
                    <label style="margin-top:0; font-size:0.8em;">Bateria Restante</label>
                    <div class="bat-container"><div id="barraBateria" class="bat-fill"></div></div>
                    <div style="text-align:right; font-size:0.8em; color:var(--dim);"><span id="txtBatFinal" style="font-weight:bold; color:#fff;">0</span>%</div>
                </div>

                <div class="resultado-grid">
                    <div class="resultado-box anim-up d-4"><div class="res-titulo">Distância</div><div class="res-valor"><span id="resDist">0</span> km</div></div>
                    <div class="resultado-box anim-up d-4"><div class="res-titulo">Autonomia</div><div class="res-valor"><span id="resAutonomia">0</span> km</div></div>
                    
                    <div class="resultado-box anim-up d-5"><div class="res-titulo">Consumo</div><div class="res-valor" style="color:var(--blue)"><span id="resConsumoP">0</span>%</div></div>
                    <div class="resultado-box anim-up d-5"><div class="res-titulo">Eficiência</div><div class="res-valor" style="color:var(--blue)"><span id="resWhKm">0</span> <small style="font-size:0.6em">Wh/km</small></div></div>
                    
                    <div class="resultado-box anim-up d-6"><div class="res-titulo">Custo Total</div><div class="res-valor" style="color:var(--yellow)">R$ <span id="resCusto">0,00</span></div></div>
                    <div class="resultado-box anim-up d-6"><div class="res-titulo">Custo / Km</div><div class="res-valor" style="color:var(--yellow)">R$ <span id="resCustoKm">0,00</span></div></div>
                </div>

                <div class="codigo-box anim-up d-7">CÓDIGO: <span id="resCodigo" style="color:#fff; font-weight:bold;">---</span></div>
                
                <button class="btn-ia anim-up d-7" onclick="analisarIA()" style="margin-top:20px;"><span class="icon-3d">📊</span> ANÁLISE INTERNA (RÁPIDA)</button>
                <div id="boxComentarioIA"></div>

                <button class="btn-gemini anim-up d-7" onclick="analisarNoGemini()">
                    <span class="icon-3d">✨</span> ANALISAR NO GEMINI
                </button>

                <div class="anim-up d-8" style="margin-top: 30px; padding-top:20px; border-top:1px solid #222;">
                    <textarea id="areaCopia" readonly></textarea>
                    <button class="btn-copy" id="btnEnviar" onclick="enviarParaPlanilha()"><span class="icon-3d">📤</span> SALVAR NA PLANILHA</button>
                </div>
                
                <div class="anim-up d-8" style="text-align:center;">
                    <button onclick="limpar()" class="btn-reset">Reiniciar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- HAPTIC & AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
            
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(15);
            }
        }

        function handleInteraction(e) {
            triggerHaptic();
            playClickSound();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const interactables = document.querySelectorAll('button, a, input, select');
            interactables.forEach(el => {
                el.addEventListener('pointerdown', handleInteraction);
                if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.addEventListener('input', handleInteraction);
                }
            });
        });

        // --- SISTEMA ORIGINAL ---
        const BAT_WH = 720; const CUSTO = 0.85; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7vEc5lfbEBSrOxAY0fmHV5E5v2I-cEppueDeZBLrLvpzC5nwAL1c0N5kHX917CUXLCA/exec";
        
        let g_whKm = 0; let g_terreno = 0; let g_carga = 0; let g_clima = 0; let g_custoKm = 0;

        function iniciarSistema() {
            tentaCarregar();
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.transform = 'scale(1.1) translateY(-20px)';
                splash.style.visibility = 'hidden';
                document.body.classList.remove('loading-state');
                setTimeout(() => { splash.style.display = 'none'; }, 800);
            }, 3500); 
        }

        function lerNumero(id) {
            let val = document.getElementById(id).value;
            if(!val) return NaN;
            val = val.replace(',', '.'); 
            return parseFloat(val);
        }

        function tentaSalvar() {
            try {
                localStorage.setItem('odoIni', document.getElementById('odoIni').value);
                localStorage.setItem('odoFim', document.getElementById('odoFim').value);
                localStorage.setItem('batIni', document.getElementById('batIni').value);
                localStorage.setItem('batFim', document.getElementById('batFim').value);
                localStorage.setItem('esf1', document.getElementById('esf1').value);
                localStorage.setItem('esf2', document.getElementById('esf2').value);
                localStorage.setItem('esf3', document.getElementById('esf3').value);
            } catch(e) {}
        }

        function tentaCarregar() {
            try {
                if(localStorage.getItem('odoIni')) document.getElementById('odoIni').value = localStorage.getItem('odoIni');
                if(localStorage.getItem('odoFim')) document.getElementById('odoFim').value = localStorage.getItem('odoFim');
                if(localStorage.getItem('batIni')) document.getElementById('batIni').value = localStorage.getItem('batIni');
                if(localStorage.getItem('batFim')) document.getElementById('batFim').value = localStorage.getItem('batFim');
                if(localStorage.getItem('esf1')) document.getElementById('esf1').value = localStorage.getItem('esf1');
                if(localStorage.getItem('esf2')) document.getElementById('esf2').value = localStorage.getItem('esf2');
                if(localStorage.getItem('esf3')) document.getElementById('esf3').value = localStorage.getItem('esf3');
            } catch(e) {}
        }

        function usarUltimo() {
            try {
                let u = localStorage.getItem('histUltimo');
                if(u) { 
                    document.getElementById('odoIni').value = u; 
                    document.getElementById('odoFim').value = ""; 
                    document.getElementById('batIni').value = "100"; 
                    document.getElementById('batFim').value = ""; 
                    tentaSalvar();
                } 
            } catch(e) {}
        }

        function animar(id, valorFinal, decimais) {
            let obj = document.getElementById(id);
            let steps = 20; let current = 0; let inc = valorFinal / steps;
            let timer = setInterval(() => {
                current += inc;
                if (current >= valorFinal) {
                    obj.innerText = valorFinal.toFixed(decimais).replace('.', ',');
                    clearInterval(timer);
                } else {
                    obj.innerText = current.toFixed(decimais).replace('.', ',');
                }
            }, 20);
        }

        // --- CÁLCULO E TRANSIÇÃO DIRETA PARA OS RESULTADOS ---
        function calcular() {
            let i = lerNumero('odoIni'); let f = lerNumero('odoFim'); let bi = lerNumero('batIni'); let bf = lerNumero('batFim');

            if (isNaN(i) || isNaN(f) || isNaN(bi) || isNaN(bf)) return;
            let dist = f - i; let consP = bi - bf;
            if (dist <= 0) return;

            let aut = (dist / consP) * 100; if (!isFinite(aut)) aut = 0;
            let whKm = (BAT_WH * (consP / 100)) / dist;
            let custoTot = (BAT_WH / 1000) * CUSTO * (consP / 100);
            let custoKm = custoTot / dist;

            g_whKm = whKm; g_custoKm = custoKm;
            g_terreno = parseInt(document.getElementById('esf1').value);
            g_carga = parseInt(document.getElementById('esf2').value);
            g_clima = parseInt(document.getElementById('esf3').value);
            let cod = `${g_terreno}.${g_carga}.${g_clima}`;

            // LÓGICA DE TRANSIÇÃO (DESAPARECE O FORM, APARECE RESULTADOS)
            let form = document.getElementById('form-container');
            form.style.transition = "opacity 0.6s ease, transform 0.6s ease";
            form.style.opacity = "0";
            form.style.transform = "scale(0.95)";

            setTimeout(() => {
                form.style.display = "none";
                
                let div = document.getElementById('resultados');
                div.style.display = 'block'; 
                
                // Animações dos números
                animar('resDist', dist, 2); animar('resAutonomia', aut, 1);
                animar('resConsumoP', consP, 0); animar('resWhKm', whKm, 2);
                animar('resCusto', custoTot, 2); animar('resCustoKm', custoKm, 3);
                
                document.getElementById('resCodigo').innerText = cod;

                // PREPARAÇÃO E ANIMAÇÃO DA BARRA DE BATERIA
                let barra = document.getElementById('barraBateria');
                barra.style.width = "0%"; 
                document.getElementById('txtBatFinal').innerText = "0";
                
                if (bf > 50) barra.style.background = "#00E676";
                else if (bf > 20) barra.style.background = "#FFD700";
                else barra.style.background = "#FF3D00";

                // Gatilho para preencher a bateria após o início da cascata
                setTimeout(() => {
                    barra.style.width = bf + "%";
                    animar('txtBatFinal', bf, 0);
                }, 500);

                try { localStorage.setItem('histUltimo', f); } catch(e){}

                let hoje = new Date().toLocaleDateString('pt-BR'); 
                let hora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
                let exp = `${hoje}\t${hora}\t${i}\t${f}\t${dist.toFixed(2).replace('.',',')}\t${bi}\t${bf}\t${consP}\t${cod}\t${whKm.toFixed(2).replace('.',',')}\tR$ ${custoTot.toFixed(2).replace('.',',')}`;
                document.getElementById('areaCopia').value = exp;
                
                document.getElementById('boxComentarioIA').style.display = 'none';
                
                // Retorna ao topo suavemente
                window.scrollTo({top: 0, behavior: 'smooth'});

            }, 600); // Aguarda o form desaparecer antes de ativar a cascata
        }

        function analisarIA() {
            let html = "";
            let titulos = ["📋 Relatório Operacional", "📊 Análise Técnica Avançada", "🔎 Diagnóstico de Performance"];
            let randT = titulos[Math.floor(Math.random() * titulos.length)];

            html += `<strong style="font-size:1.1em; color:#2196F3; display:block; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:5px;">${randT}</strong>`;

            if (g_whKm < 12) {
                html += `<div style="color:#00E676; margin-bottom:15px; text-shadow: 0 2px 4px #000;"><b>🟢 Eficiência de Elite (<12 Wh/km):</b><br>O consumo registrado demonstra uma pilotagem técnica excelente. O uso frequente da inércia e aceleração progressiva resultaram em máxima autonomia.</div>`;
            } else if (g_whKm <= 20) {
                html += `<div style="color:#FFD700; margin-bottom:15px; text-shadow: 0 2px 4px #000;"><b>🔵 Padrão Operacional (12-20 Wh/km):</b><br>O veículo operou dentro da faixa de consumo esperada pelo fabricante. O equilíbrio entre velocidade e preservação da bateria foi mantido.</div>`;
            } else {
                html += `<div style="color:#FF3D00; margin-bottom:15px; text-shadow: 0 2px 4px #000;"><b>🔴 Consumo Crítico (>20 Wh/km):</b><br>Atenção! A média superou o padrão. Isso reduz drasticamente a autonomia projetada e aumenta o desgaste da bateria.</div>`;
            }

            let box = document.getElementById('boxComentarioIA');
            box.innerHTML = html;
            box.style.display = 'block';
        }

        function analisarNoGemini() {

            const prompt = `@Google Sheets Acesse a planilha 'E-Bike Monitoramento'. 
HOJE: ${dist} km | Consumo: ${consP}% | Eficiência: ${whKm} Wh/km | Custo: R$ ${custo}

TAREFAS DE ANÁLISE:

   - REGRA DE CÁLCULO OBRIGATÓRIA (NÃO INVENTE DADOS): Assuma o consumo da moto como 35 km/litro e o preço médio da gasolina como R$ 6,00/litro. Aplique a fórmula matemática: (Distância Total / 35) * 6,00.
   - Demonstre o cálculo passo a passo na tela e, em seguida, calcule a ECONOMIA TOTAL gerada pela E-bike (Custo da Moto - Gasto Total Acumulado lido na planilha).
4. COMPARAÇÃO DE CUSTOS (E-BIKE vs. CARRO POPULAR):
   - Faça um cálculo final para mostrar o custo se a exata mesma "Distância Total" tivesse sido percorrida por um carro.
   - REGRA DE CÁLCULO OBRIGATÓRIA (NÃO INVENTE DADOS): Assuma o consumo do carro na rota urbana como 10 km/litro e a gasolina a R$ 6,00/litro. Aplique a fórmula matemática: (Distância Total / 10) * 6,00.
   - Demonstre o passo a passo e destaque em negrito a ECONOMIA TOTAL MÁXIMA alcançada com a E-bike em comparação ao uso de um carro (Custo do Carro - Gasto Total Acumulado da planilha).`;

            navigator.clipboard.writeText(prompt).then(() => {
                alert("Prompt copiado! Cole no Gemini que abrirá agora.");
                window.open("https://gemini.google.com/app", "_blank");
            }).catch(err => {
                alert("Erro ao copiar. Tente manualmente.");
            });
        }

        function limpar() { 
            localStorage.clear(); location.reload(); 
        }
        
        function enviarParaPlanilha() {
            let btn = document.getElementById('btnEnviar');
            let textoOriginal = btn.innerHTML;
            btn.innerText = "⏳ ENVIANDO...";
            btn.disabled = true;

            let dados = {
                data: new Date().toLocaleDateString('pt-BR'),
                hora: new Date().toLocaleTimeString('pt-BR'),
                odoIni: document.getElementById('odoIni').value,
                odoFim: document.getElementById('odoFim').value,
                distancia: document.getElementById('resDist').innerText,
                batIni: document.getElementById('batIni').value,
                batFim: document.getElementById('batFim').value,
                consumoP: document.getElementById('resConsumoP').innerText,
                codigo: document.getElementById('resCodigo').innerText,
                eficiencia: document.getElementById('resWhKm').innerText.replace(' Wh/km',''),
                custoTotal: document.getElementById('resCusto').innerText,
                custoKm: document.getElementById('resCustoKm').innerText
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(dados)
            })
            .then(() => {
                alert("✅ DADOS COMPLETOS ENVIADOS!");
                btn.style.background = "#00E676";
                setTimeout(() => {
                    btn.innerHTML = textoOriginal;
                    btn.disabled = false;
                }, 2000);
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("❌ Erro de conexão.");
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
                btn.style.background = "#FF3D00";
            });
        }
